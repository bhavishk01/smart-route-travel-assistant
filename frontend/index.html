<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Smart Route Travel Assistant</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "on-primary": "#ffffff",
            "surface-container-high": "#ddece2",
            "on-tertiary-container": "#49af81",
            "surface-container": "#e3f1e8",
            "secondary-container": "#aeeecb",
            "surface-tint": "#486458",
            "error": "#ba1a1a",
            "on-surface": "#121e18",
            "outline": "#727974",
            "background": "#eefdf3",
            "primary": "#07241a",
            "tertiary-fixed-dim": "#75daa8",
            "surface": "#eefdf3",
            "surface-container-lowest": "#ffffff",
            "primary-container": "#1e3a2f",
            "primary-fixed": "#caeada",
            "surface-container-highest": "#d7e6dc",
            "tertiary-fixed": "#92f7c3",
            "on-background": "#121e18",
            "outline-variant": "#c1c8c3",
            "secondary-fixed": "#b1f0ce",
            "on-surface-variant": "#424844",
            "on-secondary": "#ffffff",
            "tertiary-container": "#003d27",
            "surface-container-low": "#e8f7ed",
            "secondary": "#2c694e",
            "tertiary": "#002516",
            "surface-variant": "#d7e6dc",
            "primary-fixed-dim": "#aecebe",
            "on-secondary-container": "#316e52",
          },
          borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
          spacing: {
            "space-sm": "0.5rem", "gutter-mobile": "1rem", "space-xxl": "3.5rem",
            "margin-mobile": "1rem", "margin": "2.5rem", "space-xs": "0.25rem",
            "space-md": "1rem", "space-xxs": "0.125rem", "space-xl": "2.25rem",
            "space-lg": "1.5rem", "gutter": "1.5rem",
          },
          fontFamily: {
            "headline-sm": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"],
            "headline-md": ["Plus Jakarta Sans"], "body-sm": ["Inter"], "label-sm": ["Inter"],
            "body-md": ["Inter"], "title-sm": ["Inter"], "label-md": ["Inter"],
            "title-lg": ["Plus Jakarta Sans"], "body-lg": ["Inter"], "label-lg": ["Inter"],
            "headline-xl": ["Plus Jakarta Sans"], "title-md": ["Inter"],
          },
          fontSize: {
            "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "600" }],
            "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "600" }],
            "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
            "body-sm": ["12px", { lineHeight: "18px", fontWeight: "400" }],
            "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.04em", fontWeight: "600" }],
            "body-md": ["14px", { lineHeight: "22px", fontWeight: "400" }],
            "title-sm": ["14px", { lineHeight: "20px", fontWeight: "600" }],
            "label-md": ["12px", { lineHeight: "16px", fontWeight: "500" }],
            "title-lg": ["18px", { lineHeight: "26px", fontWeight: "600" }],
            "body-lg": ["16px", { lineHeight: "26px", fontWeight: "400" }],
            "label-lg": ["14px", { lineHeight: "20px", fontWeight: "500" }],
            "headline-xl": ["40px", { lineHeight: "48px", fontWeight: "700" }],
            "title-md": ["16px", { lineHeight: "24px", fontWeight: "600" }],
          },
        },
      },
    };

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
